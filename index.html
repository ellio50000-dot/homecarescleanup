<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈케어스클린업 | 홈페이지 시스템 점검 및 리뉴얼 중</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    body {
      background: #0A2540;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .badge {
      background: rgba(0, 102, 255, 0.25);
      border: 1px solid #0066FF;
      color: #00D4B2;
      font-size: 14px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    h1 { font-size: clamp(28px, 4.5vw, 42px); font-weight: 900; margin-bottom: 16px; word-break: keep-all; }
    p { font-size: 17px; color: #94A3B8; max-width: 600px; margin-bottom: 40px; line-height: 1.6; word-break: keep-all; }
    .contact-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px 40px;
      margin-bottom: 30px;
    }
    .contact-box span { font-size: 15px; color: #CBD5E1; display: block; margin-bottom: 8px; }
    .contact-box strong { font-size: 28px; color: #00D4B2; font-weight: 900; }
    .btn {
      display: inline-flex;
      background: #0066FF;
      color: #FFF;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(0, 102, 255, 0.4);
      transition: all 0.3s;
    }
    .btn:hover { background: #0052CC; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="badge">SYSTEM MAINTENANCE & RENEWAL</div>
  <h1>홈케어스클린업 서비스 고도화 리뉴얼 중입니다</h1>
  <p>
    우렁총각보다 완벽하고 꼼꼼한 100% 완전분해 프리미엄 케어 서비스를 위해<br>
    홈페이지 시스템 점검 및 리뉴얼 작업을 진행하고 있습니다.
  </p>

  <div class="contact-box">
    <span>에어컨 / 세탁기 완전분해 케어 즉시 예약 및 상담</span>
    <strong>📞 전화 상담 서비스 정상 가동 중</strong>
  </div>

  <a href="tel:010-0000-0000" class="btn">📞 1초 직통 전화상담 하기</a>

</body>
</html>
